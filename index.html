<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아기맞이 장바구니</title>
<meta name="theme-color" content="#3E5C82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="장바구니">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: phone-first single column; items grouped by category, each item opens a side-by-side candidate comparison */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --ink:#26303B; --muted:#6B7480; --line:#E2DDD5;
  --accent:#3E5C82; --accent-ink:#FFFFFF; --soft:#EAEFF5; --peach:#F2C7A8; --peach-ink:#4A2A14;
  --ok:#4C8C5F; --ok-soft:#E1F0E5; --warn:#B9862A; --warn-soft:#F7ECD4; --bad:#B85C4B;
  --shadow:0 1px 2px rgba(30,40,55,.06),0 6px 20px rgba(30,40,55,.06);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13171C; --surface:#1B2128; --ink:#E7EBF0; --muted:#98A2AE; --line:#2C343E;
  --accent:#8FB0D8; --accent-ink:#111821; --soft:#212B36; --peach:#E8B58F; --peach-ink:#2A170A;
  --ok:#7CC08F; --ok-soft:#1E3125; --warn:#E0B060; --warn-soft:#352B17; --bad:#E08A78;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left));padding-block:env(safe-area-inset-top,0px) calc(110px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:820px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
header.top{padding-block:20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;letter-spacing:.5px;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:14px}
.sum .k{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.sum .k.d{background:var(--peach);border-color:var(--peach);color:var(--peach-ink)}
.sum .lab{font-size:12px;opacity:.75}
.sum .v{font-family:var(--f-num);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.sum .v small{font-size:12px;font-weight:600;opacity:.7}
.meter{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.cat{margin-top:18px}
.cat h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;width:100%}
.row.skip{opacity:.55}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .p{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.must{font-size:11px;font-weight:600;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 5px}
.pill{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.todo{background:var(--soft);color:var(--muted)}
.pill.dec{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.skip{background:var(--soft);color:var(--muted);text-decoration:line-through}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ink);margin:0 0 6px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.okb{background:var(--ok);color:var(--surface)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.6}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:4px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);border-radius:999px;padding:14px 22px;font-size:16px;z-index:5}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.ovhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px 12px;position:sticky;top:0;background:var(--bg);z-index:2}
.ovhead h2{font-size:17px;margin:0;font-weight:600}
.back{border:0;background:none;font-size:15px;color:var(--accent);padding:6px 0}
.dtitle{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:4px 0 6px;overflow-wrap:anywhere}
.dmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.note-box{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-block:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.sec{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cand.pick{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.cand.got{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.cand .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cand .t{font-weight:600;font-size:16px;overflow-wrap:anywhere;min-width:0}
.cand .b{font-size:13px;color:var(--muted)}
.cand .price{font-family:var(--f-num);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc{display:grid;gap:6px;font-size:14px}
.pc div{white-space:pre-wrap;overflow-wrap:anywhere}
.pc .l{font-size:11px;font-weight:600;letter-spacing:.06em;display:block}
.pc .pro .l{color:var(--ok)} .pc .con .l{color:var(--bad)}
.cand .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea.in{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (max-width:440px){.sum .v{font-size:20px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.row{transition:transform .12s}.row:active{transform:scale(.985)}}
.salechip{font-size:11px;font-weight:600;background:var(--peach);color:var(--peach-ink);border-radius:6px;padding:0 6px}
.cand .price{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.was{font-size:13px;font-weight:600;color:var(--muted)}
.off{font-size:12px;font-weight:700;background:var(--peach);color:var(--peach-ink);border-radius:6px;padding:1px 6px;margin-top:3px}
.sale-line{font-size:13px;font-weight:600;color:var(--peach-ink);background:var(--peach);border-radius:8px;padding:4px 9px;align-self:flex-start;overflow-wrap:anywhere}
.sale-line.ended{background:var(--soft);color:var(--muted);font-weight:500}
.salebox{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.save{font-weight:600;color:var(--ok)}
.review{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.review.empty-r{background:transparent;border:1px dashed var(--line)}
.review .rhd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.review .l{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.rtext{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.rtext.clip{max-height:11.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.ract{display:flex;gap:4px;flex-wrap:wrap}
.research{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.btn.ai{background:var(--ink);color:var(--bg);text-decoration:none}
.minor{font-size:12px;color:var(--muted)}
.minor a{color:var(--muted)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.login{max-width:360px;margin:16vh auto 0;display:flex;flex-direction:column;gap:10px}
.login h1{font-size:36px}
.help{font-size:13px;color:var(--muted)}
.who{font-size:12px;color:var(--muted);text-align:right}
</style>
</head>
<body>
<div id="boot" class="wrap"><div class="empty" style="margin-top:20vh">불러오는 중…</div></div>

<div id="login" class="wrap" hidden>
  <form class="login" id="loginform">
    <h1>아기맞이 장바구니</h1>
    <p class="help" style="margin:0">Supabase에 만든 계정으로 로그인하세요.</p>
    <input id="lg-email" class="in" type="email" autocomplete="username" placeholder="이메일" required>
    <input id="lg-pw" class="in" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button class="btn" id="lg-btn" type="submit">로그인</button>
    <div class="err" id="lg-err"></div>
    <button class="linkbtn" type="button" id="lg-forgot" style="align-self:flex-start;padding-left:0">비밀번호를 잊었어요</button>
  </form>
</div>

<div id="setpw" class="wrap" hidden>
  <form class="login" id="setpwform">
    <h1>비밀번호 정하기</h1>
    <p class="help" style="margin:0" id="sp-help">앞으로 이 사이트에 로그인할 때 쓸 비밀번호를 정해 주세요.</p>
    <input id="sp-email" class="in" type="email" autocomplete="username" readonly hidden>
    <input id="sp-name" class="in" autocomplete="nickname" placeholder="화면에 보일 이름 (예: 수진)">
    <input id="sp-pw" class="in" type="password" autocomplete="new-password" placeholder="새 비밀번호 (8자 이상)" required minlength="8">
    <input id="sp-pw2" class="in" type="password" autocomplete="new-password" placeholder="새 비밀번호 한 번 더" required minlength="8">
    <button class="btn" id="sp-btn" type="submit">저장하고 시작하기</button>
    <button class="linkbtn" type="button" id="sp-cancel" hidden>취소</button>
    <div class="err" id="sp-err"></div>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <h1>아기맞이 장바구니<small>품목마다 후보를 모아 비교하고 같이 고르는 출산 준비 목록</small></h1>
    <div class="who"><span id="me"></span><br><button class="linkbtn" data-a="changepw">비밀번호 바꾸기</button> <button class="linkbtn" data-a="logout">로그아웃</button></div>
  </header>
  <div class="sum" id="sum"></div>
  <input id="q" class="search" type="search" placeholder="품목, 제품, 브랜드 검색" autocomplete="off">
  <div id="filters"></div>
  <div id="list"></div>
</div>
<button class="btn fab" data-a="additem" id="fab" hidden>+ 품목 추가</button>
<section id="detail" class="ov" hidden></section>
<section id="sheet" class="ov" hidden></section>
<div id="toast" class="toast" hidden></div>

<script src="config.js?v=20261007d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js?v=20261007d"></script>
</body>
</html>
